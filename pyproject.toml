[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "budgetsql"
version = "0.1.0"
description = "Budget-constrained agentic planning for multi-stage Text-to-SQL"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
serve = ["openai>=1.30"]
dev = ["pytest>=7.4"]

[project.scripts]
budgetsql = "budgetsql.cli:main"

[tool.setuptools.packages.find]
include = ["budgetsql*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
